name: Build dArkOS4Clone R36 Ultra

on:
  push:
    branches:
      - darkos4clone
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    env:
      PART_001_URL: https://github.com/lcdyk0517/arkos4clone/releases/download/20260324/dArkOS4Clone-03132026.img.xz.7z.001
      PART_002_URL: https://github.com/lcdyk0517/arkos4clone/releases/download/20260324/dArkOS4Clone-03132026.img.xz.7z.002
      PART_003_URL: https://github.com/lcdyk0517/arkos4clone/releases/download/20260324/dArkOS4Clone-03132026.img.xz.7z.003
      TOOLCHAIN_URL: https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
      RELEASE_TAG_PREFIX: r36ultra-build
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            p7zip-full \
            xz-utils \
            unzip \
            rsync \
            parted \
            u-boot-tools \
            qemu-user-static \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            ccache

      # Must run before the toolchain is added to GITHUB_PATH so /usr/lib/ccache wrappers win over
      # the real aarch64-linux-gnu-gcc in the Linaro bin directory.
      - name: Configure ccache
        run: |
          set -euo pipefail
          echo "/usr/lib/ccache" >> "${GITHUB_PATH}"
          mkdir -p "${CCACHE_DIR}"
          ccache --version
          ccache --max-size=10G
          ccache --zero-stats || true
          ccache --show-config || true

      - name: Download and install Linaro toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN_ROOT="${HOME}/toolchains"
          TOOLCHAIN_ARCHIVE="${RUNNER_TEMP:-/tmp}/$(basename "${TOOLCHAIN_URL}")"
          mkdir -p "${TOOLCHAIN_ROOT}"
          wget -q --show-progress -O "${TOOLCHAIN_ARCHIVE}" "${TOOLCHAIN_URL}"
          tar -xJf "${TOOLCHAIN_ARCHIVE}" -C "${TOOLCHAIN_ROOT}"
          echo "${TOOLCHAIN_ROOT}/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin" >> "${GITHUB_PATH}"

      - name: Prepare workspace from git clones
        run: |
          set -euo pipefail
          mkdir -p .github/artifacts

          clone_or_update() {
            local repo_path="$1"
            local repo_url="$2"
            local branch="$3"

            if [[ -d "${repo_path}/.git" ]]; then
              git -C "${repo_path}" fetch --all --tags --prune
              git -C "${repo_path}" checkout -B "${branch}" "origin/${branch}"
              git -C "${repo_path}" pull --ff-only
            else
              git clone --branch "${branch}" "${repo_url}" "${repo_path}"
            fi
          }

          # Repos cloned into the same directories as the old XML manifest.
          clone_or_update "scripts" "https://github.com/yajnab/kernel_builder.git" "arkos"
          clone_or_update "kernel" "https://github.com/yajnab/arkos_kernel.git" "rg351"
          clone_or_update "arkos4clone" "https://github.com/yajnab/arkos4clone.git" "main"
          clone_or_update "device_files" "https://github.com/ZyoungInc/r36ultra-linux.git" "main"

          # Provide the same entrypoints the XML `linkfile` used to create.
          [[ -d scripts ]] && ln -sf scripts/kernel_arkos.sh kernel_arkos.sh || true
          [[ -d scripts ]] && ln -sf scripts/rescr.sh rescr.sh || true
          [[ -f kernel_arkos.sh ]] && chmod +x kernel_arkos.sh || true

          # Ensure any submodules are present.
          for repo_path in scripts kernel arkos4clone device_files; do
            if [[ -d "${repo_path}/.git" ]]; then
              git -C "${repo_path}" submodule sync --recursive || true
              git -C "${repo_path}" submodule update --init --recursive
            fi
          done

      # kernel_builder clone may lag behind; ensure ccache wraps the cross compiler until upstream
      # always sets CROSS_COMPILE (scripts/kernel_arkos.sh does when ccache is installed).
      - name: Ensure kernel build uses ccache
        run: |
          set -euo pipefail
          f="${GITHUB_WORKSPACE}/scripts/kernel_arkos.sh"
          [[ -f "${f}" ]] || { echo "scripts/kernel_arkos.sh missing"; exit 1; }
          if [[ -n "${CCACHE_DISABLE:-}" ]]; then
            echo "CCACHE_DISABLE set; skip."
            exit 0
          fi
          if grep -qF 'ccache aarch64-linux-gnu-' "${f}"; then
            echo "kernel_arkos.sh already uses ccache for CROSS_COMPILE."
            exit 0
          fi
          if grep -qE '^[[:space:]]*export CROSS_COMPILE=aarch64-linux-gnu-$' "${f}"; then
            sed -i 's/^\([[:space:]]*\)export CROSS_COMPILE=aarch64-linux-gnu-$/\1export CROSS_COMPILE="ccache aarch64-linux-gnu-"/' "${f}"
            echo "Applied ccache CROSS_COMPILE (fallback for older kernel_builder)."
          else
            echo "::warning::Could not patch CROSS_COMPILE for ccache — check scripts/kernel_arkos.sh"
          fi

      - name: Compute cache keys
        id: cache-keys
        run: |
          set -euo pipefail
          KERNEL_SHA="$(git -C kernel rev-parse HEAD)"
          echo "kernel_sha=${KERNEL_SHA}" >> "${GITHUB_OUTPUT}"
          echo "ccache_key=ccache-${{ runner.os }}-aarch64-${KERNEL_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Restore kernel ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-keys.outputs.ccache_key }}
          restore-keys: |
            ccache-${{ runner.os }}-aarch64-

      - name: Download and extract base dArkOS image
        run: |
          set -euo pipefail
          WORK_DIR="${RUNNER_TEMP:-/tmp}/base-darkos"
          mkdir -p "${WORK_DIR}" .github/artifacts

          wget -q --show-progress -O "${WORK_DIR}/$(basename "${PART_001_URL}")" "${PART_001_URL}"
          wget -q --show-progress -O "${WORK_DIR}/$(basename "${PART_002_URL}")" "${PART_002_URL}"
          wget -q --show-progress -O "${WORK_DIR}/$(basename "${PART_003_URL}")" "${PART_003_URL}"

          pushd "${WORK_DIR}" >/dev/null
          7z x -y "$(basename "${PART_001_URL}")"
          IMG_XZ="$(ls -1 *.img.xz | head -n1)"
          [[ -n "${IMG_XZ}" ]] || { echo "No .img.xz extracted"; exit 1; }
          xz -dk "${IMG_XZ}"
          BASE_IMG="${WORK_DIR}/${IMG_XZ%.xz}"
          [[ -f "${BASE_IMG}" ]] || { echo "No base .img found"; exit 1; }
          popd >/dev/null

          cp -f "${BASE_IMG}" "./$(basename "${BASE_IMG}")"
          printf '%s' "$(pwd)/$(basename "${BASE_IMG}")" > .github/artifacts/base_img_path.txt

      - name: Build kernel and stage Arkbuild content
        env:
          UNIT: r36ultra
          CHIPSET: rk3326
          DEVICE_FILES_DIR: ${{ github.workspace }}/device_files
        run: |
          set -euo pipefail
          [[ -x ./kernel_arkos.sh ]] || { echo "kernel_arkos.sh missing or not executable"; exit 1; }
          chmod +x .github/scripts/ci-stage-kernel-artifacts.sh
          ./kernel_arkos.sh
          .github/scripts/ci-stage-kernel-artifacts.sh
          ccache --show-stats || true

      - name: Save kernel ccache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-keys.outputs.ccache_key }}

      - name: Build final R36 Ultra image
        run: |
          set -euo pipefail
          [[ -f .github/artifacts/base_img_path.txt ]] || { echo "Missing base image path"; exit 1; }
          BASE_IMG="$(tr -d '\r\n' < .github/artifacts/base_img_path.txt)"
          [[ -f "${BASE_IMG}" ]] || { echo "Base image not found: ${BASE_IMG}"; exit 1; }

          chmod +x ./arkos4clone/build_image.sh
          sudo ./arkos4clone/build_image.sh "${BASE_IMG}" "${RUNNER_TEMP:-/tmp}/arkos-build-work"

          FINAL_IMAGE="$(ls -1t ./arkos4clone/*4Clone-yajnab-*.img.xz | head -n1)"
          [[ -n "${FINAL_IMAGE}" && -f "${FINAL_IMAGE}" ]] || { echo "Final image not found"; exit 1; }
          sudo chown "${USER}:${USER}" "${FINAL_IMAGE}"
          chmod 0644 "${FINAL_IMAGE}"
          printf '%s' "${FINAL_IMAGE}" > .github/artifacts/final_image_path.txt

      - name: Prepare release files (split if >2GB)
        run: |
          set -euo pipefail
          OUTPUT_FILE="$(tr -d '\r\n' < .github/artifacts/final_image_path.txt)"
          [[ -r "${OUTPUT_FILE}" ]] || { echo "Output file is not readable: ${OUTPUT_FILE}"; exit 1; }

          mkdir -p .github/artifacts/release

          SIZE_BYTES="$(stat -c '%s' "${OUTPUT_FILE}")"
          LIMIT_BYTES=2147483648
          echo "Final image: ${OUTPUT_FILE} (${SIZE_BYTES} bytes)"

          if (( SIZE_BYTES < LIMIT_BYTES )); then
            cp -f "${OUTPUT_FILE}" .github/artifacts/release/
          else
            echo "Image exceeds GitHub Release asset limit; splitting into <2GB parts."
            split -b 1900m -d -a 3 "${OUTPUT_FILE}" ".github/artifacts/release/$(basename "${OUTPUT_FILE}").part"
          fi

          ls -1 .github/artifacts/release/* > .github/artifacts/release_files.txt
          [[ -s .github/artifacts/release_files.txt ]] || { echo "No release files produced"; exit 1; }

      - name: Prepare release metadata
        run: |
          [[ -s .github/artifacts/release_files.txt ]] || { echo "Missing release files list"; exit 1; }
          {
            echo 'OUTPUT_FILES<<EOF'
            cat .github/artifacts/release_files.txt
            echo EOF
          } >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${RELEASE_TAG_PREFIX}-$(date +%Y%m%d-%H%M%S)" >> "${GITHUB_ENV}"

      - name: Publish release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: R36 Ultra dArkOS Build ${{ env.RELEASE_TAG }}
          body: Automated dArkOS4Clone R36 Ultra build from workflow.
          files: ${{ env.OUTPUT_FILES }}
