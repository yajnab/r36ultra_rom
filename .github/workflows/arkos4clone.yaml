name: Build ArkOS4Clone R36 Ultra

on:
  push:
    branches:
      - arkos4clone
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    env:
      PART_001_URL: https://github.com/lcdyk0517/arkos4clone/releases/download/20260324/ArkOS4Clone-03132026.img.xz.7z.001
      PART_002_URL: https://github.com/lcdyk0517/arkos4clone/releases/download/20260324/ArkOS4Clone-03132026.img.xz.7z.002
      PART_003_URL: https://github.com/lcdyk0517/arkos4clone/releases/download/20260324/ArkOS4Clone-03132026.img.xz.7z.003
      TOOLCHAIN_URL: https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
      RELEASE_TAG_PREFIX: r36ultra-build

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            p7zip-full \
            xz-utils \
            unzip \
            rsync \
            parted \
            u-boot-tools \
            qemu-user-static \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev

      - name: Download and install Linaro toolchain
        run: |
          set -euo pipefail
          TOOLCHAIN_ROOT="${HOME}/toolchains"
          TOOLCHAIN_ARCHIVE="${RUNNER_TEMP:-/tmp}/$(basename "${TOOLCHAIN_URL}")"
          mkdir -p "${TOOLCHAIN_ROOT}"
          wget -q --show-progress -O "${TOOLCHAIN_ARCHIVE}" "${TOOLCHAIN_URL}"
          tar -xJf "${TOOLCHAIN_ARCHIVE}" -C "${TOOLCHAIN_ROOT}"
          echo "${TOOLCHAIN_ROOT}/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu/bin" >> "${GITHUB_PATH}"

      - name: Prepare workspace from git clones
        run: |
          set -euo pipefail
          mkdir -p .github/artifacts

          clone_or_update() {
            local repo_path="$1"
            local repo_url="$2"
            local branch="$3"

            if [[ -d "${repo_path}/.git" ]]; then
              git -C "${repo_path}" fetch --all --tags --prune
              git -C "${repo_path}" checkout -B "${branch}" "origin/${branch}"
              git -C "${repo_path}" pull --ff-only
            else
              git clone --branch "${branch}" "${repo_url}" "${repo_path}"
            fi
          }

          # Repos cloned into the same directories as the old XML manifest.
          clone_or_update "scripts" "https://github.com/yajnab/kernel_builder.git" "arkos"
          clone_or_update "kernel" "https://github.com/yajnab/arkos_kernel.git" "rg351"
          clone_or_update "arkos4clone" "https://github.com/yajnab/arkos4clone.git" "main"
          clone_or_update "device_files" "https://github.com/ZyoungInc/r36ultra-linux.git" "main"

          # Provide the same entrypoints the XML `linkfile` used to create.
          [[ -d scripts ]] && ln -sf scripts/kernel_arkos.sh kernel_arkos.sh || true
          [[ -d scripts ]] && ln -sf scripts/rescr.sh rescr.sh || true
          [[ -f kernel_arkos.sh ]] && chmod +x kernel_arkos.sh || true

          # Ensure any submodules are present.
          for repo_path in scripts kernel arkos4clone device_files; do
            if [[ -d "${repo_path}/.git" ]]; then
              git -C "${repo_path}" submodule sync --recursive || true
              git -C "${repo_path}" submodule update --init --recursive
            fi
          done

      - name: Download and extract base ArkOS image
        run: |
          set -euo pipefail
          WORK_DIR="${RUNNER_TEMP:-/tmp}/base-arkos"
          mkdir -p "${WORK_DIR}" .github/artifacts

          wget -q --show-progress -O "${WORK_DIR}/$(basename "${PART_001_URL}")" "${PART_001_URL}"
          wget -q --show-progress -O "${WORK_DIR}/$(basename "${PART_002_URL}")" "${PART_002_URL}"
          wget -q --show-progress -O "${WORK_DIR}/$(basename "${PART_003_URL}")" "${PART_003_URL}"

          pushd "${WORK_DIR}" >/dev/null
          7z x -y "$(basename "${PART_001_URL}")"
          IMG_XZ="$(ls -1 *.img.xz | head -n1)"
          [[ -n "${IMG_XZ}" ]] || { echo "No .img.xz extracted"; exit 1; }
          xz -dk "${IMG_XZ}"
          BASE_IMG="${WORK_DIR}/${IMG_XZ%.xz}"
          [[ -f "${BASE_IMG}" ]] || { echo "No base .img found"; exit 1; }
          popd >/dev/null

          cp -f "${BASE_IMG}" "./$(basename "${BASE_IMG}")"
          printf '%s' "$(pwd)/$(basename "${BASE_IMG}")" > .github/artifacts/base_img_path.txt

      - name: Build kernel and stage Arkbuild content
        run: |
          set -euo pipefail
          [[ -x ./kernel_arkos.sh ]] || { echo "kernel_arkos.sh missing or not executable"; exit 1; }
          ./kernel_arkos.sh

          KERNEL_IMAGE_SRC="$(pwd)/kernel/arch/arm64/boot/Image"
          KERNEL_IMAGE_DST="$(pwd)/arkos4clone/consoles/kernel/common/Image"
          [[ -f "${KERNEL_IMAGE_SRC}" ]] || { echo "Kernel Image not found"; exit 1; }
          mkdir -p "$(dirname "${KERNEL_IMAGE_DST}")"
          cp -f "${KERNEL_IMAGE_SRC}" "${KERNEL_IMAGE_DST}"

          ARKBUILD_ROOT="$(pwd)/Arkbuild"
          mkdir -p "${ARKBUILD_ROOT}"
          # Some branches may not ship the 720P logo; fall back to the first available resolution.
          LOGO_SRC=""
          for d in 720P 768P 540P 480P 854x480P; do
            if [[ -f "$(pwd)/arkos4clone/consoles/logo/${d}/logo.bmp" ]]; then
              LOGO_SRC="$(pwd)/arkos4clone/consoles/logo/${d}/logo.bmp"
              break
            fi
          done
          [[ -n "${LOGO_SRC}" ]] || { echo "No logo.bmp found under arkos4clone/consoles/logo/*/logo.bmp"; exit 1; }
          cp -f "${LOGO_SRC}" "${ARKBUILD_ROOT}/"
          echo "Using logo: ${LOGO_SRC}"
          cp -a "$(pwd)/arkos4clone/consoles/r36ultra/." "${ARKBUILD_ROOT}/"

      - name: Build final R36 Ultra image
        run: |
          set -euo pipefail
          [[ -f .github/artifacts/base_img_path.txt ]] || { echo "Missing base image path"; exit 1; }
          BASE_IMG="$(tr -d '\r\n' < .github/artifacts/base_img_path.txt)"
          [[ -f "${BASE_IMG}" ]] || { echo "Base image not found: ${BASE_IMG}"; exit 1; }

          chmod +x ./arkos4clone/build_image.sh
          sudo ./arkos4clone/build_image.sh "${BASE_IMG}" "${RUNNER_TEMP:-/tmp}/arkos-build-work"

          FINAL_IMAGE="$(ls -1t ./arkos4clone/*4Clone-yajnab-*.img.xz | head -n1)"
          [[ -n "${FINAL_IMAGE}" && -f "${FINAL_IMAGE}" ]] || { echo "Final image not found"; exit 1; }
          sudo chown "${USER}:${USER}" "${FINAL_IMAGE}"
          chmod 0644 "${FINAL_IMAGE}"
          printf '%s' "${FINAL_IMAGE}" > .github/artifacts/final_image_path.txt

      - name: Prepare release metadata
        run: |
          OUTPUT_FILE="$(tr -d '\r\n' < .github/artifacts/final_image_path.txt)"
          [[ -r "${OUTPUT_FILE}" ]] || { echo "Output file is not readable: ${OUTPUT_FILE}"; exit 1; }
          echo "OUTPUT_FILE=${OUTPUT_FILE}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${RELEASE_TAG_PREFIX}-$(date +%Y%m%d-%H%M%S)" >> "${GITHUB_ENV}"

      - name: Publish release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: R36 Ultra Build ${{ env.RELEASE_TAG }}
          body: Automated ArkOS4Clone R36 Ultra build from workflow.
          files: ${{ env.OUTPUT_FILE }}
